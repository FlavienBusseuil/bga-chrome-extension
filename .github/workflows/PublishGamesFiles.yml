name: Publish games files

# Publishes the games CSS and configurations updated since the last release, downloaded by the extension without updating it
# (see src/js/utils/remoteGames.ts). Run manually from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-games-files

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the games files updated since the last release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The files of the release are the reference: only the games changed since are published
          git worktree add "$RUNNER_TEMP/release" "v$VERSION"
          npm install --prefix "$RUNNER_TEMP/tools" --no-save less@4.6.4
          # The date of the last change of the games: it doesn't change when the games don't change
          PUBLISHED=$(git log -1 --format=%ct -- src/games)
          NODE_PATH="$RUNNER_TEMP/tools/node_modules" node scripts/buildRemoteGames.js "$RUNNER_TEMP/release/src" src "$VERSION" "$PUBLISHED" "$RUNNER_TEMP/games.json"

      - name: Commit on the games-files branch
        run: |
          PUBLISH="$RUNNER_TEMP/publish"
          if git ls-remote --exit-code --heads origin games-files; then
            git fetch origin games-files
            git worktree add -B games-files "$PUBLISH" origin/games-files
          else
            git worktree add --orphan -b games-files "$PUBLISH"
          fi
          cd "$PUBLISH"
          # Each version of the extension downloads its own file (games-{version}.json)
          # The versions until 2.1.1 download games.json: it becomes the file of its version, and is updated with it
          LEGACY_VERSION=$([ -f games.json ] && node -p "require('./games.json').version" || true)
          if [ -n "$LEGACY_VERSION" ] && [ ! -f "games-$LEGACY_VERSION.json" ]; then
            cp games.json "games-$LEGACY_VERSION.json"
          fi
          cp "$RUNNER_TEMP/games.json" "games-$VERSION.json"
          if [ "$LEGACY_VERSION" = "$VERSION" ]; then
            cp "games-$VERSION.json" games.json
          fi
          # Only the files of the 5 last versions are kept
          ls games-*.json | sort -V | head -n -5 | xargs -r rm
          if [ -n "$LEGACY_VERSION" ] && [ ! -f "games-$LEGACY_VERSION.json" ]; then
            rm games.json
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing has changed since the last publication"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish games files"
          git push origin games-files

      - name: Purge the jsDelivr cache
        # jsDelivr is the fallback of GitHub: it can still serve the previous commit of the branch for 12 hours, even after the purge
        run: |
          curl -fsS -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@games-files/games-$VERSION.json"
          # the file of the versions until 2.1.1 (it may have been updated or removed)
          curl -fsS -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@games-files/games.json"
